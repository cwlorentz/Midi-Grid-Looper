<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101217">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Touch-first step grid looper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Grid Looper</title>
<style>
:root{
  --bg:#0c0d10; --panel:#16181d; --panel2:#23262e; --line:#2c3039; --text:#f2f3f5; --dim:#8b909c;
  --cell-a:#1e2128; --cell-b:#252932; --ph:#3c4252; --accent:#ffb340;
  --top-h:76px; --head-w:clamp(240px,23vw,300px);
  --tile:56px;   /* every button in the top bar is a tile of this size */
  --ms:var(--tile); /* mute/solo tiles match the top-bar tiles */
  --deck-h:calc(var(--tile) * 3 + 96px); --deck-w:304px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* metro tiles: flat, square, no borders, bold uppercase labels */
button{font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:inherit;
  background:var(--panel2);border:none;border-radius:2px;touch-action:manipulation;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;flex:none;transition:transform .06s}
button:active{filter:brightness(1.3);transform:scale(.95)}

/* ---------- top bar ---------- */
#top{height:var(--top-h);flex:none;display:flex;align-items:center;gap:14px;padding:10px 12px;
  background:var(--panel)}
.group{display:flex;align-items:center;gap:6px;height:100%}
.group>label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.tile{width:var(--tile);height:var(--tile);font-size:26px;line-height:1}
.tile.txt{font-size:13px}
#play{background:#2a7fff;color:#fff}
#play.on{background:var(--accent);color:#111}
#bpmVal{min-width:84px;height:var(--tile);display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:300;font-variant-numeric:tabular-nums;background:var(--bg);
  border-radius:2px;touch-action:none;cursor:ns-resize}
.val{min-width:46px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:15px;font-weight:600}
#swing,#master{width:clamp(110px,13vw,190px)}
.spacer{flex:1}
#clear.armed{background:#e5393b;color:#fff}

/* ---------- sliders (flat bar, square thumb) ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:34px;margin:0;touch-action:none;
  --p:50%;--fill:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:0;
  background:linear-gradient(to right,var(--fill) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:28px;border-radius:1px;
  background:var(--text);margin-top:-11px;border:none}
input[type=range]::-moz-range-track{height:6px;border-radius:0;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:0;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:16px;height:28px;border-radius:1px;background:var(--text);border:none}

/* ---------- grid ---------- */
#grid{flex:1;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:6px;padding:6px 10px 10px}
@media (max-height:760px){:root{--tile:48px;--deck-w:270px}}
.row{display:grid;grid-template-columns:var(--head-w) 1fr;gap:10px;min-height:0}
.head{display:grid;grid-template-columns:minmax(0,1fr) var(--ms) var(--ms);grid-template-rows:minmax(0,1fr) 18px;
  gap:0 6px;background:var(--panel);border-radius:0;padding:4px 4px 4px 10px;border-left:6px solid var(--c);min-height:0}
.name{background:transparent;justify-content:flex-start;text-align:left;font-size:13px;line-height:1;letter-spacing:.03em;color:var(--c);
  padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:0}
.name:active{transform:none}
.mute,.solo{grid-row:1/-1;width:var(--ms);height:100%;max-height:var(--tile);align-self:center;font-size:17px}
.mute{grid-column:2}.solo{grid-column:3}
.mute.on{background:#e5393b;color:#fff}
.solo.on{background:#f0c419;color:#111}
.head .vol{grid-column:1;grid-row:2;width:100%;height:18px;--fill:var(--c)}
.head .vol::-webkit-slider-thumb{width:12px;height:18px;margin-top:-6px}
/* 16 steps plus a thin spacer column between each group of 4, so every step is the same width */
.steps{display:grid;column-gap:4px;touch-action:none;min-height:0;
  grid-template-columns:repeat(4,minmax(0,1fr)) 4px repeat(4,minmax(0,1fr)) 4px repeat(4,minmax(0,1fr)) 4px repeat(4,minmax(0,1fr))}
.cell:nth-child(5){grid-column:6}.cell:nth-child(9){grid-column:11}.cell:nth-child(13){grid-column:16}
.cell{border-radius:2px;background:var(--cell-a);min-height:0}
.cell.gb{background:var(--cell-b)}
.cell.ph{background:var(--ph)}
.cell.on{background:var(--c)}
.cell.on.ph{background:#fff;box-shadow:inset 0 0 0 5px var(--c)}
.row.silent .steps,.row.silent .name{opacity:.35}

/* ---------- looper deck: 8 big pads under the grid, like a hardware looper ---------- */
#deck{flex:none;height:var(--deck-h);display:grid;grid-template-columns:var(--deck-w) minmax(0,1fr);gap:10px;padding:0 10px 10px}
#deckCtl{display:flex;flex-direction:column;gap:6px;background:var(--panel);padding:8px;min-height:0}
.drow{display:flex;gap:6px;align-items:center;flex:none}
.drow>label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 2px 0 4px}
#barsRow button{flex:1;width:auto;min-width:0}
.seg.on,#countIn.on{background:var(--accent);color:#111}
#recStatus{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:13px;line-height:1.3;font-weight:600;color:var(--dim);padding:0 4px}
#recStatus span{overflow:hidden;max-height:2.6em}
#meter{height:6px;background:var(--line);visibility:hidden}
#meter.show{visibility:visible}
#meter i{display:block;height:100%;width:0;background:#5ee08a}
#latVal{min-width:64px;height:var(--tile);flex:1;display:flex;align-items:center;justify-content:center;font-size:17px;
  font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:2px;touch-action:none;cursor:ns-resize}
#pads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;min-width:0;min-height:0}
.strip{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.pad{flex:1;min-height:0;width:100%;position:relative;overflow:hidden;display:block;background:var(--panel2);text-align:left}
.pad:active{transform:scale(.97)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad span{position:absolute;pointer-events:none;white-space:nowrap}
.pnum{left:10px;top:4px;font-size:30px;font-weight:300;color:var(--c)}
.pst{left:10px;top:44px;font-size:12px;letter-spacing:.1em}
.pname{left:10px;right:8px;bottom:12px;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.pprog{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--c)}
.pad.empty .pst{color:var(--dim)}
.pad.empty .pnum{color:var(--dim)}
.pad.play{background:color-mix(in srgb,var(--c) 16%,var(--panel2))}
.pad.armed{animation:blink .8s steps(2) infinite}
.pad.rec{background:#c62828;color:#fff}
.pad.dub{background:#e8590c;color:#fff}
.pad.rec .pnum,.pad.dub .pnum,.pad.rec .pname,.pad.dub .pname{color:#fff}
.pad.rec .pprog,.pad.dub .pprog{background:#fff}
.pad.muted{opacity:.4}
@keyframes blink{50%{background:#c62828;color:#fff}}
.sbtn{display:flex;gap:6px;flex:none}
.sbtn button{flex:1;width:auto;min-width:0;height:var(--tile);font-size:17px}
.sbtn .mute.on{background:#e5393b;color:#fff}
.sbtn .del.armed{background:#e5393b;color:#fff}
.strip.empty .sbtn,.strip.empty .vol{opacity:.3;pointer-events:none}
.strip .vol{flex:none;width:100%;height:22px;--fill:var(--c)}
.strip.cancel .del{opacity:1;pointer-events:auto;background:#e5393b;color:#fff}
.strip.cancel .sbtn{opacity:1;pointer-events:auto}

/* ---------- message banner ---------- */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));z-index:15;
  display:none;align-items:center;gap:14px;padding:10px 10px 10px 18px;background:#e5393b;color:#fff;font-size:15px;line-height:1.35}
#toast.show{display:flex}
#toast.info{background:var(--panel2)}
#toast span{flex:1}
#toast button{background:rgba(0,0,0,.25)}

/* ---------- overlays ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;
  flex-direction:column;gap:12px;font-size:22px;text-align:center;padding:24px}
#rotate span{font-size:56px}
@media (max-width:1100px){.name{font-size:12px}}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<header id="top">
  <button id="play" class="tile" aria-label="Play">▶</button>
  <div class="group">
    <label>BPM</label>
    <button id="bpmDown" class="tile" aria-label="Slower">−</button>
    <div id="bpmVal" role="spinbutton" aria-label="Tempo, drag up or down">120</div>
    <button id="bpmUp" class="tile" aria-label="Faster">+</button>
  </div>
  <div class="group">
    <label for="swing">Swing</label>
    <input id="swing" type="range" min="50" max="75" step="1" value="50">
    <span id="swingVal" class="val">50%</span>
  </div>
  <div class="group">
    <label for="master">Master</label>
    <input id="master" type="range" min="0" max="100" step="1" value="80">
  </div>
  <div class="spacer"></div>
  <button id="clear" class="tile txt">Clear</button>
  <button id="fs" class="tile" aria-label="Full screen">⛶</button>
</header>
<main id="grid"></main>
<section id="deck">
  <div id="deckCtl">
    <div class="drow">
      <label>In</label>
      <button class="tile txt seg" data-src="mic" aria-label="Record from the microphone">Mic</button>
      <button class="tile txt seg" data-src="grid" aria-label="Record the drum grid">Grid</button>
      <button id="countIn" class="tile txt" aria-label="One bar of clicks before recording">Count</button>
    </div>
    <div class="drow" id="barsRow">
      <label>Bars</label>
      <button class="tile seg" data-bars="1">1</button>
      <button class="tile seg" data-bars="2">2</button>
      <button class="tile seg" data-bars="4">4</button>
      <button class="tile seg" data-bars="8">8</button>
      <button class="tile txt seg" data-bars="0" aria-label="Free length: tap the pad again to end">Free</button>
    </div>
    <div class="drow">
      <label>Delay</label>
      <div id="latVal" role="spinbutton" aria-label="Mic delay in milliseconds, drag up or down">0</div>
      <button id="calib" class="tile txt" aria-label="Measure mic delay">Cal</button>
    </div>
    <div id="recStatus"><span>Ready</span><div id="meter"><i></i></div></div>
  </div>
  <div id="pads"></div>
</section>
<div id="toast" role="alert"><span></span><button class="tile" aria-label="Dismiss">✕</button></div>
<div id="rotate"><span>⟳</span>Turn the tablet sideways (landscape) to use the looper.</div>

<script>
'use strict';
/* =========================================================
   Grid Looper, Phase 1: 8-track drum step sequencer
   ========================================================= */
const STEPS = 16;
const LOOKAHEAD = 0.12;     // seconds of audio scheduled ahead
const TICK_MS = 25;         // scheduler wake-up interval
const STORE_KEY = 'gridlooper.v1';

const TRACKS = [
  { name: 'Kick',       voice: 'kick',  color: '#ff5a5a' },
  { name: 'Snare',      voice: 'snare', color: '#ffb340' },
  { name: 'Clap',       voice: 'clap',  color: '#ffe14d' },
  { name: 'Closed Hat', voice: 'chh',   color: '#5ee08a' },
  { name: 'Open Hat',   voice: 'ohh',   color: '#3fd0c9' },
  { name: 'Low Tom',    voice: 'ltom',  color: '#4da3ff' },
  { name: 'High Tom',   voice: 'htom',  color: '#8f7bff' },
  { name: 'Cowbell',    voice: 'cow',   color: '#ff6fd0' },
];

/* ---------------- state + persistence ---------------- */
function demoState() {
  const pat = {
    kick: [0, 7, 8, 10], snare: [4, 12], clap: [12], chh: [0, 2, 4, 6, 8, 10, 12],
    ohh: [14], ltom: [], htom: [], cow: [],
  };
  return {
    bpm: 112, swing: 54, master: 80,
    tracks: TRACKS.map(t => ({
      steps: Array.from({ length: STEPS }, (_, i) => pat[t.voice].includes(i)),
      vol: 0.8, mute: false, solo: false,
    })),
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.tracks) && s.tracks.length === TRACKS.length) return s;
  } catch (e) {}
  return null;
}
const state = load() || demoState();
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }, 300);
}

/* ---------------- audio engine ---------------- */
let ctx = null, masterGain, gridBus, noiseBuf, trackGains = [], openHat = null;

function initAudio() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC({ latencyHint: 'interactive' });
  const comp = ctx.createDynamicsCompressor();      // keeps the sum from clipping
  comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 6;
  comp.attack.value = 0.003; comp.release.value = 0.12;
  masterGain = ctx.createGain();
  masterGain.connect(comp); comp.connect(ctx.destination);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  gridBus = ctx.createGain();                     // all drum tracks, tapped when bouncing the grid to a layer
  gridBus.connect(masterGain);
  trackGains = TRACKS.map(() => { const g = ctx.createGain(); g.connect(gridBus); return g; });
  applyMix(true);
  if (ctx.state !== 'running') ctx.resume();
}

// exponential attack/decay envelope on a gain param
function env(param, t, peak, attack, decay) {
  param.setValueAtTime(0.0001, t);
  param.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
  param.exponentialRampToValueAtTime(0.0001, t + attack + decay);
}
function noiseSrc(t, dur) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  s.start(t, Math.random() * 1.5);
  s.stop(t + dur);
  return s;
}
function filt(type, freq, q) {
  const f = ctx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q;
  return f;
}
function osc(type, freq) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; return o;
}

function tom(t, out, v, f, dec) {
  const o = osc('sine', f * 1.6), g = ctx.createGain();
  o.frequency.setValueAtTime(f * 1.6, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.08);
  env(g.gain, t, 0.9 * v, 0.003, dec);
  o.connect(g).connect(out); o.start(t); o.stop(t + dec + 0.05);
}

// 808-style metallic source: six detuned square waves
const HAT_RATIOS = [2, 3, 4.16, 5.43, 6.79, 8.21];
function hat(t, out, v, dec, open) {
  if (openHat) {   // any hat chokes a ringing open hat
    const g = openHat.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else g.cancelScheduledValues(t);
    g.setTargetAtTime(0.0001, t, 0.008);
    openHat = null;
  }
  const bp = filt('bandpass', 10000, 0.8), hp = filt('highpass', 7000), g = ctx.createGain();
  const sum = ctx.createGain(); sum.gain.value = 0.25;
  const stopAt = t + dec + 0.05;
  for (const r of HAT_RATIOS) { const o = osc('square', 40 * r); o.connect(sum); o.start(t); o.stop(stopAt); }
  sum.connect(bp).connect(hp).connect(g).connect(out);
  env(g.gain, t, 2.2 * v, 0.002, dec);
  if (open) openHat = g;
}

const VOICES = {
  kick(t, out, v) {
    const o = osc('sine', 160), g = ctx.createGain();
    o.frequency.setValueAtTime(165, t);
    o.frequency.exponentialRampToValueAtTime(52, t + 0.11);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.45);
    env(g.gain, t, 1.0 * v, 0.003, 0.5);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.6);
    const n = noiseSrc(t, 0.02), ng = ctx.createGain(), lp = filt('lowpass', 2500);
    env(ng.gain, t, 0.35 * v, 0.001, 0.012);
    n.connect(lp).connect(ng).connect(out);
  },
  snare(t, out, v) {
    const o = osc('triangle', 190), og = ctx.createGain();
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
    env(og.gain, t, 0.55 * v, 0.002, 0.11);
    o.connect(og).connect(out); o.start(t); o.stop(t + 0.2);
    const n = noiseSrc(t, 0.3), hp = filt('highpass', 1300), ng = ctx.createGain();
    env(ng.gain, t, 0.6 * v, 0.002, 0.2);
    n.connect(hp).connect(ng).connect(out);
  },
  clap(t, out, v) {
    const n = noiseSrc(t, 0.3), bp = filt('bandpass', 1250, 1.1), g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    for (const dt of [0, 0.011, 0.022]) {
      g.gain.setValueAtTime(1.9 * v, t + dt);
      g.gain.exponentialRampToValueAtTime(0.06, t + dt + 0.009);
    }
    g.gain.setValueAtTime(1.7 * v, t + 0.033);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.033 + 0.2);
    n.connect(bp).connect(g).connect(out);
  },
  chh(t, out, v) { hat(t, out, v, 0.05, false); },
  ohh(t, out, v) { hat(t, out, v, 0.38, true); },
  ltom(t, out, v) { tom(t, out, v, 95, 0.38); },
  htom(t, out, v) { tom(t, out, v, 150, 0.3); },
  cow(t, out, v) {
    const bp = filt('bandpass', 1700, 0.9), g = ctx.createGain(), s = ctx.createGain();
    s.gain.value = 0.35;
    for (const f of [540, 800]) { const o = osc('square', f); o.connect(s); o.start(t); o.stop(t + 0.35); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1.0 * v, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.35 * v, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    s.connect(bp).connect(g).connect(out);
  },
};

function audible(i) {
  const anySolo = state.tracks.some(t => t.solo);
  const t = state.tracks[i];
  return !t.mute && (!anySolo || t.solo);
}
function applyMix(immediate) {
  state.tracks.forEach((t, i) => {
    const on = audible(i);
    rows[i].classList.toggle('silent', !on);
    if (ctx) {
      const g = on ? t.vol * t.vol : 0;   // squared for a more natural fader feel
      if (immediate) trackGains[i].gain.value = g;
      else trackGains[i].gain.setTargetAtTime(g, ctx.currentTime, 0.015);
    }
  });
  if (ctx) masterGain.gain.setTargetAtTime(Math.pow(state.master / 100, 2), ctx.currentTime, 0.015);
}
function audition(i) {
  initAudio();
  const v = state.tracks[i].vol;
  VOICES[TRACKS[i].voice](ctx.currentTime + 0.005, masterGain, Math.max(v * v, 0.05));
}

/* ---------------- scheduler ---------------- */
let playing = false, curStep = 0, nextTime = 0, queue = [];
const stepDur = () => 60 / state.bpm / 4;

function schedule() {
  if (!playing) return;
  // if the device stalled (screen off, heavy load) don't fire a burst of catch-up notes
  if (nextTime < ctx.currentTime - 0.05) nextTime = ctx.currentTime + 0.02;
  while (nextTime < ctx.currentTime + LOOKAHEAD) {
    const sd = stepDur();
    const swing = (curStep % 2) ? (state.swing / 100 * 2 - 1) * sd : 0;
    const t = nextTime + swing;
    if (curStep === 0) onBar(nextTime);
    for (let i = 0; i < TRACKS.length; i++) {
      if (state.tracks[i].steps[curStep] && audible(i)) VOICES[TRACKS[i].voice](t, trackGains[i], 1);
    }
    queue.push({ step: curStep, time: t });
    nextTime += sd;
    curStep = (curStep + 1) % STEPS;
  }
}

// timer runs in a Worker so it keeps ticking when the main thread is busy
let timer;
try {
  const src = `let id=0;onmessage=e=>{if(e.data==='start'){clearInterval(id);id=setInterval(()=>postMessage(0),${TICK_MS})}else{clearInterval(id);id=0}}`;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  w.onmessage = schedule;
  timer = { start: () => w.postMessage('start'), stop: () => w.postMessage('stop') };
} catch (e) {
  let id = 0;
  timer = { start: () => { clearInterval(id); id = setInterval(schedule, TICK_MS); }, stop: () => clearInterval(id) };
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

function start() {
  initAudio();
  playing = true;
  curStep = 0;
  queue = [];
  barCount = -1; barTimes = [];
  nextTime = ctx.currentTime + 0.06;
  schedule();
  timer.start();
  playBtn.classList.add('on'); playBtn.textContent = '■'; playBtn.setAttribute('aria-label', 'Stop');
  keepAwake(true);
}
function stop() {
  playing = false;
  timer.stop();
  queue = [];
  if (rec.state === 'count' || rec.state === 'wait' || rec.state === 'rec') cancelRec('Recording cancelled');
  stopLayers();
  setPlayhead(-1);
  playBtn.classList.remove('on'); playBtn.textContent = '▶'; playBtn.setAttribute('aria-label', 'Play');
  keepAwake(false);
}

/* ---------------- UI build ---------------- */
const $ = id => document.getElementById(id);
const gridEl = $('grid'), playBtn = $('play');
const rows = [], cells = [];

TRACKS.forEach((tr, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.setProperty('--c', tr.color);
  row.innerHTML =
    `<div class="head">
       <button class="name" data-t="${i}">${tr.name}</button>
       <button class="mute" data-t="${i}" aria-label="Mute ${tr.name}">M</button>
       <button class="solo" data-t="${i}" aria-label="Solo ${tr.name}">S</button>
       <input class="vol" type="range" min="0" max="100" step="1" data-t="${i}" aria-label="${tr.name} volume">
     </div>
     <div class="steps"></div>`;
  const stepsEl = row.querySelector('.steps');
  cells[i] = [];
  for (let s = 0; s < STEPS; s++) {
    const c = document.createElement('div');
    c.className = 'cell' + ((s >> 2) % 2 ? ' gb' : '');
    c.dataset.t = i; c.dataset.s = s;
    stepsEl.appendChild(c);
    cells[i][s] = c;
  }
  gridEl.appendChild(row);
  rows[i] = row;
});

function setRange(el, value) {
  el.value = value;
  el.style.setProperty('--p', ((value - el.min) / (el.max - el.min) * 100) + '%');
}
function render() {
  state.tracks.forEach((t, i) => {
    t.steps.forEach((on, s) => cells[i][s].classList.toggle('on', on));
    rows[i].querySelector('.mute').classList.toggle('on', t.mute);
    rows[i].querySelector('.solo').classList.toggle('on', t.solo);
    setRange(rows[i].querySelector('.vol'), Math.round(t.vol * 100));
  });
  $('bpmVal').textContent = state.bpm;
  setRange($('swing'), state.swing); $('swingVal').textContent = state.swing + '%';
  setRange($('master'), state.master);
  applyMix(true);
}

let phStep = -1;
function setPlayhead(s) {
  if (s === phStep) return;
  if (phStep >= 0) for (let i = 0; i < TRACKS.length; i++) cells[i][phStep].classList.remove('ph');
  phStep = s;
  if (s >= 0) for (let i = 0; i < TRACKS.length; i++) cells[i][s].classList.add('ph');
}
// move the playhead when each step is actually heard (accounts for output latency)
function draw() {
  if (playing && ctx) {
    const now = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
    let s = null;
    while (queue.length && queue[0].time <= now) s = queue.shift().step;
    if (s !== null) setPlayhead(s);
  }
  drawLayers();
  requestAnimationFrame(draw);
}

/* ---------------- grid touch: tap or drag along a row to paint ---------------- */
const painters = new Map();
function setCell(c, on) {
  const t = +c.dataset.t, s = +c.dataset.s;
  if (state.tracks[t].steps[s] === on) return;
  state.tracks[t].steps[s] = on;
  c.classList.toggle('on', on);
  save();
}
gridEl.addEventListener('pointerdown', e => {
  const c = e.target.closest('.cell');
  if (!c) return;
  e.preventDefault();
  initAudio();
  // touch pointers are implicitly captured; release so moves can be hit-tested across cells
  if (c.hasPointerCapture && c.hasPointerCapture(e.pointerId)) c.releasePointerCapture(e.pointerId);
  const t = +c.dataset.t, mode = !state.tracks[t].steps[+c.dataset.s];
  painters.set(e.pointerId, { mode, row: t, last: c });
  setCell(c, mode);
  if (mode && !playing) audition(t);
});
gridEl.addEventListener('pointermove', e => {
  const p = painters.get(e.pointerId);
  if (!p) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const c = el && el.closest('.cell');
  if (c && c !== p.last && +c.dataset.t === p.row) { p.last = c; setCell(c, p.mode); }
});
for (const ev of ['pointerup', 'pointercancel']) gridEl.addEventListener(ev, e => painters.delete(e.pointerId));

/* ---------------- track header controls ---------------- */
gridEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  const i = +b.dataset.t, t = state.tracks[i];
  if (b.classList.contains('name')) audition(i);
  else if (b.classList.contains('mute')) { t.mute = !t.mute; b.classList.toggle('on', t.mute); applyMix(); save(); }
  else if (b.classList.contains('solo')) { t.solo = !t.solo; b.classList.toggle('on', t.solo); applyMix(); save(); }
});
gridEl.addEventListener('input', e => {
  if (!e.target.classList.contains('vol')) return;
  const i = +e.target.dataset.t;
  state.tracks[i].vol = e.target.value / 100;
  setRange(e.target, e.target.value);
  applyMix(); save();
});

/* ---------------- transport controls ---------------- */
playBtn.addEventListener('pointerdown', e => { e.preventDefault(); playing ? stop() : start(); });

function setBpm(b) {
  state.bpm = Math.max(40, Math.min(240, Math.round(b)));
  $('bpmVal').textContent = state.bpm;
  retimeLayers();
  save();
}
// press-and-hold repeat on − / +
for (const [id, d] of [['bpmDown', -1], ['bpmUp', 1]]) {
  const b = $(id);
  let hold = 0, rep = 0;
  const end = () => { clearTimeout(hold); clearInterval(rep); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); setBpm(state.bpm + d);
    hold = setTimeout(() => { rep = setInterval(() => setBpm(state.bpm + d), 60); }, 400);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, end);
}
// drag up/down on the number for big jumps
{
  const el = $('bpmVal');
  let drag = null;
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); drag = { y: e.clientY, b: state.bpm }; });
  el.addEventListener('pointermove', e => { if (drag) setBpm(drag.b + (drag.y - e.clientY) / 3); });
  for (const ev of ['pointerup', 'pointercancel']) el.addEventListener(ev, () => { drag = null; });
}
$('swing').addEventListener('input', e => {
  state.swing = +e.target.value; setRange(e.target, state.swing);
  $('swingVal').textContent = state.swing + '%'; save();
});
$('master').addEventListener('input', e => {
  state.master = +e.target.value; setRange(e.target, state.master); applyMix(); save();
});

// Clear needs a second tap within 2.5 s
{
  const b = $('clear');
  let armed = 0;
  b.addEventListener('click', () => {
    if (!armed) {
      b.classList.add('armed'); b.textContent = 'Sure?';
      armed = setTimeout(() => { armed = 0; b.classList.remove('armed'); b.textContent = 'Clear'; }, 2500);
      return;
    }
    clearTimeout(armed); armed = 0; b.classList.remove('armed'); b.textContent = 'Clear';
    state.tracks.forEach(t => t.steps.fill(false));
    render(); save();
  });
}

$('fs').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); return; }
    await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
});

/* =========================================================
   Looper deck: 8 pads under the grid, each an audio loop recorded from the mic
   or bounced from the grid. Tap an empty pad to record, tap a playing pad to
   overdub. Recording always starts and ends on a bar line.
   ========================================================= */
const MAX_LAYERS = 8;
const LAYER_COLORS = ['#4da3ff', '#ff6fd0', '#5ee08a', '#ffb340', '#8f7bff', '#3fd0c9', '#ffe14d', '#ff5a5a'];
const MAX_REC_BARS = 64;
// metadata lives in state (localStorage); the audio itself in IndexedDB, keyed by layer id
if (!Array.isArray(state.layers)) state.layers = [];
state.layers.forEach((l, i) => { if (l.slot == null) l.slot = i; });
state.rec = Object.assign({ src: 'mic', bars: 2, countIn: true, latency: null }, state.rec);

const layerAudio = new Map();   // id -> AudioBuffer
const layerSrc = new Map();     // id -> the AudioBufferSourceNode playing now
const layerGains = new Map();   // id -> GainNode
let barCount = -1, barTimes = []; // most recent bar starts the scheduler has queued: {idx, time}

const barDur = () => stepDur() * STEPS;
const mod = (a, n) => ((a % n) + n) % n;
const layerById = id => state.layers.find(l => l.id === id);
const layerAt = slot => state.layers.find(l => l.slot === slot);

/* ---------- IndexedDB (a few MB per layer is too big for localStorage) ---------- */
let dbP = null;
function db() {
  return dbP || (dbP = new Promise((res, rej) => {
    const r = indexedDB.open('gridlooper', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('layers');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function dbDo(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('layers', mode), req = fn(tx.objectStore('layers'));
    tx.oncomplete = () => res(req.result);
    tx.onerror = tx.onabort = () => rej(tx.error);
  });
}
function storeLayer(l) {
  const b = layerAudio.get(l.id);
  return dbDo('readwrite', st => st.put({ sr: b.sampleRate, data: b.getChannelData(0) }, l.id))
    .catch(() => toast('This loop plays now but could not be saved (storage full or blocked).', 'info'));
}
async function loadLayers() {
  const keep = [];
  for (const l of state.layers) {
    try {
      const r = await dbDo('readonly', st => st.get(l.id));
      if (!r || !r.data) continue;
      const b = new AudioBuffer({ length: r.data.length, sampleRate: r.sr, numberOfChannels: 1 });
      b.copyToChannel(r.data, 0);
      layerAudio.set(l.id, b);
      keep.push(l);
    } catch (e) {}
  }
  if (keep.length !== state.layers.length) { state.layers = keep; save(); }
  renderPads();
}

/* ---------- playback: every bar, each layer gets a fresh source at the right spot ---------- */
function layerGain(l) {
  let g = layerGains.get(l.id);
  if (!g) { g = ctx.createGain(); g.gain.value = l.mute ? 0 : l.vol * l.vol; g.connect(masterGain); layerGains.set(l.id, g); }
  return g;
}
function applyLayerMix(l) {
  const g = layerGains.get(l.id);
  if (g) g.gain.setTargetAtTime(l.mute ? 0 : l.vol * l.vol, ctx.currentTime, 0.015);
}
// start layer l at time `when`, which is `frac` of the way into transport bar `idx`
function layerPlay(l, when, idx, frac) {
  const buf = layerAudio.get(l.id);
  if (!buf || !ctx) return;
  const off = (mod(idx - l.phase, l.bars) + frac) * l.barDur;
  const old = layerSrc.get(l.id);
  if (old) { try { old.stop(when); } catch (e) {} }
  if (off >= buf.duration) { layerSrc.delete(l.id); return; }
  const s = ctx.createBufferSource();
  s.buffer = buf;
  s.playbackRate.value = l.barDur / barDur();    // other tempo than recorded: speed (and pitch) follow
  s.connect(layerGain(l));
  s.start(when, off);
  layerSrc.set(l.id, s);
}
function onBar(t) {
  barCount++;
  barTimes.push({ idx: barCount, time: t });
  if (barTimes.length > 4) barTimes.shift();
  recOnBar(t);
  for (const l of state.layers) layerPlay(l, t, barCount, 0);
}
// bring a layer in right away (mid-bar), and at any bar line already queued
function layerJoin(l) {
  if (!playing) return;
  const t = ctx.currentTime + 0.03;
  barTimes.forEach((b, i) => {
    if (b.time > t) layerPlay(l, b.time, b.idx, 0);
    else if (i === barTimes.length - 1 || barTimes[i + 1].time > t) layerPlay(l, t, b.idx, Math.min((t - b.time) / barDur(), 0.999));
  });
}
function stopLayers() {
  for (const s of layerSrc.values()) { try { s.stop(); } catch (e) {} }
  layerSrc.clear();
}
function retimeLayers() {
  if (!ctx) return;
  for (const [id, s] of layerSrc) {
    const l = layerById(id);
    if (l) s.playbackRate.setValueAtTime(l.barDur / barDur(), ctx.currentTime);
  }
}
function deleteLayer(l) {
  const s = layerSrc.get(l.id);
  if (s) { try { s.stop(); } catch (e) {} layerSrc.delete(l.id); }
  const g = layerGains.get(l.id);
  if (g) { g.disconnect(); layerGains.delete(l.id); }
  layerAudio.delete(l.id);
  state.layers = state.layers.filter(x => x !== l);
  dbDo('readwrite', st => st.delete(l.id)).catch(() => {});
  save(); renderPads();
}
// where the listener is in the transport right now: bar index and fraction of the bar
function heardPos() {
  if (!playing || !ctx) return null;
  const now = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  for (let i = barTimes.length - 1; i >= 0; i--) {
    if (barTimes[i].time <= now) return { idx: barTimes[i].idx, frac: Math.min((now - barTimes[i].time) / barDur(), 0.999) };
  }
  return null;
}

/* ---------- capture: an AudioWorklet copies exact sample ranges, so takes line up with the bar ---------- */
const CAPTURE_SRC = `class Cap extends AudioWorkletProcessor{
constructor(){super();this.job=null;this.peak=0;this.n=0;
this.port.onmessage=e=>{const m=e.data;
if(m.cmd==='start')this.job={id:m.id,start:m.start,stop:Infinity,parts:[],len:0};
else if(m.cmd==='stop'){if(this.job&&this.job.id===m.id)this.job.stop=m.stop}
else if(m.cmd==='cancel')this.job=null}}
process(inputs){const ch=inputs[0]&&inputs[0][0],n=ch?ch.length:128,f0=currentFrame,j=this.job;
if(ch)for(let i=0;i<n;i++){const a=Math.abs(ch[i]);if(a>this.peak)this.peak=a}
if(++this.n>=8){this.port.postMessage({peak:this.peak});this.peak=0;this.n=0}
if(j){const next=j.start+j.len;
if(f0>next&&next<j.stop){const z=Math.min(f0,j.stop)-next;j.parts.push(new Float32Array(z));j.len+=z}
const a=Math.max(j.start+j.len,f0),b=Math.min(j.stop,f0+n);
if(b>a){const p=new Float32Array(b-a);if(ch)p.set(ch.subarray(a-f0,b-f0));j.parts.push(p);j.len+=b-a}
if(f0+n>=j.stop){const want=Math.max(0,j.stop-j.start),out=new Float32Array(want);let o=0;
for(const p of j.parts){if(o>=want)break;const q=p.length>want-o?p.subarray(0,want-o):p;out.set(q,o);o+=q.length}
this.port.postMessage({id:j.id,data:out},[out.buffer]);this.job=null}}
return true}}
registerProcessor('gl-capture',Cap);`;

let workletP = null, micCap = null, gridCap = null, micStream = null, micSrc = null, micInLatency = 0;
let jobSeq = 0, meterPeak = 0, meterLevel = 0;
const jobWait = new Map();

class UserError extends Error {}

function capNode() {
  const n = new AudioWorkletNode(ctx, 'gl-capture', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
  n.port.onmessage = e => {
    const m = e.data;
    if (m.id) { const r = jobWait.get(m.id); if (r) { jobWait.delete(m.id); r(m.data); } }
    else if (n === micCap && micStream) meterPeak = Math.max(meterPeak, m.peak);
  };
  n.connect(ctx.destination);   // outputs silence; the connection just keeps it running
  return n;
}
function ensureWorklet() {
  if (!ctx.audioWorklet) return Promise.reject(new UserError('Recording needs a newer Chrome (AudioWorklet is missing). Open the app from its https:// address in Chrome.'));
  return workletP || (workletP = ctx.audioWorklet
    .addModule(URL.createObjectURL(new Blob([CAPTURE_SRC], { type: 'text/javascript' })))
    .then(() => { micCap = capNode(); gridCap = capNode(); gridBus.connect(gridCap); })
    .catch(e => { workletP = null; throw e; }));
}
async function ensureMic() {
  if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new UserError('The mic only works when the app is opened from its https:// address (GitHub Pages or Netlify), not from a file on the tablet.');
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1, latency: 0 } });
  } catch (e) {
    micStream = null;
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw new UserError(
      'Microphone access is blocked for this app. In Chrome tap ⋮ › Settings › Site settings › Microphone, allow this site, then tap the pad again.');
    if (e.name === 'NotFoundError' || e.name === 'OverconstrainedError') throw new UserError('No microphone found on this device.');
    if (e.name === 'NotReadableError') throw new UserError('The microphone is busy in another app. Close it and try again.');
    throw new UserError('Could not open the microphone (' + e.name + ').');
  }
  const track = micStream.getAudioTracks()[0];
  const st = track.getSettings ? track.getSettings() : {};
  micInLatency = typeof st.latency === 'number' ? st.latency : 0.01;
  track.addEventListener('ended', releaseMic);
  micSrc = ctx.createMediaStreamSource(micStream);
  micSrc.connect(micCap);
}
function releaseMic() {
  if (micSrc) { micSrc.disconnect(); micSrc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
function captureStart(node, startFrame) {
  const id = ++jobSeq;
  node.port.postMessage({ cmd: 'start', id, start: startFrame });
  return {
    done: new Promise(r => jobWait.set(id, r)),
    stop: f => node.port.postMessage({ cmd: 'stop', id, stop: f }),
    cancel: () => { node.port.postMessage({ cmd: 'cancel' }); jobWait.delete(id); },
  };
}

// mic delay = time from a note being scheduled to its echo reaching the worklet (out + in)
function autoLatencyMs() {
  const out = ctx ? (ctx.outputLatency || ctx.baseLatency || 0.02) : 0.02;
  return Math.round((out + micInLatency) * 1000);
}
const latencyMs = () => state.rec.latency != null ? state.rec.latency : autoLatencyMs();

/* ---------- recording: one take at a time, either a new loop or an overdub on an existing one ---------- */
// state: idle | prep (opening mic) | count | wait (for the bar line) | rec | finish | calib
const rec = { state: 'idle', mode: 'new', slot: -1, layerId: null, src: 'mic', bars: 2,
  startBar: 0, endBar: null, offset: 0, cap: null };

function click(t, accent) {
  const o = osc('square', accent ? 1600 : 1100), g = ctx.createGain();
  env(g.gain, t, 0.35, 0.001, 0.04);
  o.connect(g).connect(masterGain); o.start(t); o.stop(t + 0.06);
}
const frameAt = t => Math.round((t + rec.offset) * ctx.sampleRate);
function beginRec(t) {
  rec.state = 'rec';
  rec.startBar = barCount;
  rec.endBar = rec.mode === 'new' && rec.bars ? barCount + rec.bars : null;
  rec.cap = captureStart(rec.src === 'mic' ? micCap : gridCap, frameAt(t));
}
function endRec(t, idx) {
  rec.state = 'finish';
  const meta = { mode: rec.mode, slot: rec.slot, layerId: rec.layerId, src: rec.src, startBar: rec.startBar, bars: idx - rec.startBar };
  rec.cap.stop(frameAt(t));
  rec.cap.done.then(data => {
    rec.state = 'idle'; rec.cap = null;
    if (meta.mode === 'new') finishTake(data, meta); else finishDub(data, meta);
  });
}
function recOnBar(t) {
  if (rec.state === 'count' || rec.state === 'wait') {
    if (barCount >= rec.startBar) beginRec(t);
    else if (rec.state === 'count') for (let q = 0; q < 4; q++) click(t + q * 4 * stepDur(), q === 0);
  } else if (rec.state === 'rec') {
    if (barCount === rec.endBar || barCount - rec.startBar >= MAX_REC_BARS) endRec(t, barCount);
  }
}
// second tap while recording: end on the nearest bar line (a tap just after one still counts)
function requestStop() {
  const pos = heardPos();
  let end = pos ? (pos.frac < 0.2 ? pos.idx : pos.idx + 1) : barCount + 1;
  end = Math.max(end, rec.startBar + 1);
  if (rec.mode === 'new' && rec.bars) end = Math.min(end, rec.startBar + rec.bars);
  const queued = barTimes.find(b => b.idx === end);
  if (end <= barCount && queued) endRec(queued.time, end);
  else rec.endBar = Math.max(end, barCount + 1);
}
async function onPadTap(slot) {
  initAudio();
  if (rec.state === 'calib' || rec.state === 'finish' || rec.state === 'prep') return;
  if (rec.state !== 'idle') {
    if (rec.slot !== slot) { toast('Pad ' + (rec.slot + 1) + ' is recording. Tap it to finish first.', 'info', 2500); return; }
    if (rec.state === 'rec') requestStop(); else cancelRec();
    return;
  }
  const l = layerAt(slot);
  rec.state = 'prep'; rec.slot = slot;
  try {
    await ensureWorklet();
    if (state.rec.src === 'mic') await ensureMic();
  } catch (e) {
    rec.state = 'idle';
    toast(e instanceof UserError ? e.message : 'Recording failed to start: ' + e.message);
    return;
  }
  if (rec.state !== 'prep') return;    // cancelled while the mic was opening
  hideToast();
  rec.mode = l ? 'dub' : 'new'; rec.layerId = l ? l.id : null;
  rec.src = state.rec.src; rec.bars = state.rec.bars; rec.endBar = null;
  rec.offset = rec.src === 'mic' ? latencyMs() / 1000 : 0;
  if (!playing) {
    const ci = state.rec.countIn && rec.src === 'mic';
    rec.startBar = ci ? 1 : 0;
    rec.state = ci ? 'count' : 'wait';
    start();
  } else {
    const last = barTimes[barTimes.length - 1];
    if (last && last.time > ctx.currentTime + 0.02) beginRec(last.time);  // that bar line is queued but not heard yet
    else { rec.startBar = barCount + 1; rec.state = 'wait'; }
  }
}
function cancelRec(msg) {
  if (rec.cap && rec.state === 'rec') rec.cap.cancel();
  rec.cap = null; rec.state = 'idle';
  if (msg) toast(msg, 'info', 2500);
}
const peakOf = d => { let p = 0; for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > p) p = a; } return p; };
function fadeEnds(d) {   // 3 ms fades so a mic take doesn't click where it starts and stops
  const f = Math.min(Math.round(ctx.sampleRate * 0.003), d.length >> 1);
  for (let i = 0; i < f; i++) { d[i] *= i / f; d[d.length - 1 - i] *= i / f; }
}
function finishTake(data, meta) {
  if (!data || !data.length || meta.bars < 1 || layerAt(meta.slot)) return;
  const sr = ctx.sampleRate;
  let inGain = 1;
  if (meta.src === 'mic') {
    const peak = peakOf(data);
    inGain = peak > 0.001 && peak < 0.7 ? Math.min(0.7 / peak, 8) : 1;   // lift quiet takes, up to 8x
    for (let i = 0; i < data.length; i++) data[i] *= inGain;
    fadeEnds(data);
    if (peak < 0.002) toast('That take was silent. Check the mic isn\'t covered or muted.', 'info');
  }
  const n = state.layers.filter(l => l.src === meta.src).length + 1;
  const l = {
    id: 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    slot: meta.slot, src: meta.src, name: (meta.src === 'mic' ? 'Mic ' : 'Grid ') + n, color: LAYER_COLORS[meta.slot],
    vol: 0.8, mute: false, bars: meta.bars, barDur: data.length / sr / meta.bars, phase: mod(meta.startBar, meta.bars), inGain, v: 0,
  };
  const b = ctx.createBuffer(1, data.length, sr);
  b.copyToChannel(data, 0);
  layerAudio.set(l.id, b);
  state.layers.push(l);
  save(); renderPads();
  layerJoin(l);
  storeLayer(l);
}
// mix an overdub into its loop: each captured bar lands on the loop bar that was playing then
function finishDub(data, meta) {
  const l = layerById(meta.layerId), old = l && layerAudio.get(l.id);
  if (!old || !data || !data.length || meta.bars < 1) return;
  if (meta.src === 'mic') { const g = l.inGain || 1; for (let i = 0; i < data.length; i++) data[i] *= g; fadeEnds(data); }
  const d = Float32Array.from(old.getChannelData(0));
  const spb = d.length / l.bars, inSpb = data.length / meta.bars, step = inSpb / spb;   // resample if the tempo moved
  for (let j = 0; j < meta.bars; j++) {
    const base = Math.round(mod(meta.startBar + j - l.phase, l.bars) * spb);
    const n = Math.min(Math.round(spb), d.length - base);
    for (let i = 0; i < n; i++) {
      const x = j * inSpb + i * step, k = Math.floor(x), f = x - k;
      if (k + 1 >= data.length) break;
      d[base + i] += data[k] * (1 - f) + data[k + 1] * f;
    }
  }
  const b = ctx.createBuffer(1, d.length, old.sampleRate);
  b.copyToChannel(d, 0);
  layerAudio.set(l.id, b);
  l.v = (l.v || 0) + 1;
  save(); renderPads();
  layerJoin(l);
  storeLayer(l);
}

// play clicks out of the speaker, find them in the mic signal, and use the median delay
async function calibrate() {
  initAudio();
  if (rec.state !== 'idle') return;
  rec.state = 'calib'; rec.slot = -1;
  try {
    await ensureWorklet(); await ensureMic();
    if (playing) stop();
    const N = 6, GAP = 0.5, PRE = 0.1, sr = ctx.sampleRate, t0 = ctx.currentTime + 0.4;
    const out = ctx.createGain(); out.gain.value = 0.6; out.connect(ctx.destination);
    for (let i = 0; i < N; i++) {
      const o = osc('square', 1000), g = ctx.createGain();
      env(g.gain, t0 + i * GAP, 1, 0.001, 0.03);
      o.connect(g).connect(out); o.start(t0 + i * GAP); o.stop(t0 + i * GAP + 0.05);
    }
    // listen a little before each click too, to know how quiet the room is
    const cap = captureStart(micCap, Math.round((t0 - PRE) * sr));
    cap.stop(Math.round((t0 + N * GAP) * sr));
    const data = await cap.done;
    const delays = [];
    for (let i = 0; i < N; i++) {
      const a = Math.round((PRE + i * GAP) * sr), b = Math.min(data.length, Math.round((PRE + i * GAP + 0.45) * sr));
      let pk = 0, floor = 0;
      for (let k = a; k < b; k++) pk = Math.max(pk, Math.abs(data[k]));
      for (let k = a - Math.round(0.05 * sr); k < a; k++) floor = Math.max(floor, Math.abs(data[k]));
      if (pk < 0.02 || pk < floor * 4) continue;
      for (let k = a; k < b; k++) if (Math.abs(data[k]) > pk * 0.35) { delays.push((k - a) / sr); break; }
    }
    delays.sort((x, y) => x - y);
    const med = delays[delays.length >> 1];
    const agree = delays.filter(d => Math.abs(d - med) < 0.012).length;
    if (delays.length < 4 || agree < 4) {
      toast('Couldn\'t hear the test clicks clearly. Unplug headphones, turn the volume up, keep the room quiet and try Cal again.', 'info');
    } else {
      state.rec.latency = Math.round(med * 1000);
      save();
      toast('Mic delay measured: ' + state.rec.latency + ' ms. Takes will be shifted by that much.', 'info', 4000);
    }
  } catch (e) {
    toast(e instanceof UserError ? e.message : 'Measuring failed: ' + e.message);
  }
  rec.state = 'idle';
}

/* ---------- deck UI ---------- */
const padsEl = $('pads'), strips = [];
for (let i = 0; i < MAX_LAYERS; i++) {
  const el = document.createElement('div');
  el.className = 'strip';
  el.style.setProperty('--c', LAYER_COLORS[i]);
  el.innerHTML =
    `<button class="pad" data-slot="${i}" aria-label="Loop pad ${i + 1}">
       <canvas></canvas><span class="pnum">${i + 1}</span><span class="pst"></span><span class="pname"></span><i class="pprog"></i>
     </button>
     <div class="sbtn">
       <button class="mute" data-slot="${i}" aria-label="Mute loop ${i + 1}">M</button>
       <button class="del" data-slot="${i}" aria-label="Clear loop ${i + 1}">✕</button>
     </div>
     <input class="vol" type="range" min="0" max="100" step="1" data-slot="${i}" aria-label="Loop ${i + 1} volume">`;
  padsEl.appendChild(el);
  strips[i] = { el, pad: el.querySelector('.pad'), canvas: el.querySelector('canvas'), st: el.querySelector('.pst'),
    name: el.querySelector('.pname'), prog: el.querySelector('.pprog'), mute: el.querySelector('.mute'),
    del: el.querySelector('.del'), vol: el.querySelector('.vol'), drawn: null, cls: '', txt: '' };
}
function drawWave(r, l) {
  const c = r.canvas, w = Math.round(c.clientWidth * devicePixelRatio), h = Math.round(c.clientHeight * devicePixelRatio);
  const key = l ? l.id + ':' + (l.v || 0) + ':' + w + 'x' + h : 'none';
  if (r.drawn === key || !w) return;
  r.drawn = key;
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const buf = l && layerAudio.get(l.id);
  if (!buf) return;
  g.fillStyle = 'rgba(255,255,255,.1)';
  for (let b = 1; b < l.bars; b++) g.fillRect(Math.round(b / l.bars * w), 0, Math.max(1, devicePixelRatio), h);
  const d = buf.getChannelData(0), per = d.length / w, mid = h * 0.55, amp = h * 0.3;
  g.fillStyle = l.color;
  g.globalAlpha = 0.75;
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let k = Math.floor(x * per), e = Math.min(d.length, Math.floor((x + 1) * per)); k < e; k += 4) {
      const v = d[k]; if (v < lo) lo = v; if (v > hi) hi = v;
    }
    g.fillRect(x, mid - Math.min(hi, 1) * amp, 1, Math.max(1, (Math.min(hi, 1) - Math.max(lo, -1)) * amp));
  }
}
function renderPads() {
  strips.forEach((r, i) => {
    const l = layerAt(i);
    r.el.classList.toggle('empty', !l);
    r.mute.classList.toggle('on', !!(l && l.mute));
    setRange(r.vol, l ? Math.round(l.vol * 100) : 0);
    r.name.textContent = l ? `${l.name} · ${l.bars} bar${l.bars > 1 ? 's' : ''}` : '';
    drawWave(r, l);
  });
  $('deck').querySelectorAll('[data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === state.rec.src));
  $('deck').querySelectorAll('[data-bars]').forEach(b => b.classList.toggle('on', +b.dataset.bars === state.rec.bars));
  $('countIn').classList.toggle('on', state.rec.countIn);
}

let lastStatus = '';
function drawLayers() {
  const pos = heardPos();
  const busy = rec.state !== 'idle' && rec.state !== 'calib';
  let status = state.layers.length ? 'Tap a pad to record · tap a loop to overdub' : 'Tap a pad to record a loop';
  let recTxt = '', recProg = -1;
  switch (rec.state) {
    case 'prep': recTxt = state.rec.src === 'mic' ? 'MIC…' : 'READY'; status = state.rec.src === 'mic' ? 'Opening mic…' : 'Starting…'; break;
    case 'calib': status = 'Measuring mic delay… stay quiet'; break;
    case 'count':
      recTxt = pos && pos.idx < rec.startBar ? 'COUNT ' + (Math.floor(pos.frac * 4) + 1) : 'COUNT';
      status = 'Count-in, then ' + (rec.mode === 'dub' ? 'overdub' : 'record'); break;
    case 'wait': recTxt = 'NEXT BAR'; status = (rec.mode === 'dub' ? 'Overdub' : 'Recording') + ' starts on the next bar · tap to cancel'; break;
    case 'rec': {
      const b = pos && pos.idx >= rec.startBar ? pos.idx - rec.startBar : 0;
      const ending = rec.endBar != null && (rec.mode === 'dub' || !rec.bars || rec.endBar < rec.startBar + rec.bars);
      if (rec.mode === 'new' && rec.bars) { recTxt = `REC ${Math.min(b + 1, rec.bars)}/${rec.bars}`; recProg = (Math.min(b, rec.bars - 1) + (pos ? pos.frac : 0)) / rec.bars; }
      else recTxt = (rec.mode === 'dub' ? 'DUB ' : 'REC ') + (b + 1);
      if (ending) recTxt = 'ENDING';
      status = rec.mode === 'dub' ? 'Overdubbing · tap the pad to stop on the next bar' :
        rec.bars ? `Recording ${rec.bars} bar${rec.bars > 1 ? 's' : ''} · tap the pad to end early` : 'Recording · tap the pad to end on the next bar';
      break;
    }
    case 'finish': recTxt = 'SAVING'; status = 'Saving take…'; break;
  }
  strips.forEach((r, i) => {
    const l = layerAt(i), mine = busy && rec.slot === i;
    let cls = 'pad', txt = '';
    if (mine && (rec.state === 'rec' || rec.state === 'finish')) { cls += rec.mode === 'dub' ? ' dub' : ' rec'; txt = recTxt; }
    else if (mine) { cls += ' armed'; txt = recTxt; }
    else if (!l) { cls += ' empty'; txt = '● REC'; }
    else if (l.mute) { cls += ' play muted'; txt = 'MUTED'; }
    else { cls += ' play'; txt = pos ? 'PLAY' : 'READY'; }
    if (r.cls !== cls) { r.pad.className = cls; r.cls = cls; }
    if (r.txt !== txt) { r.st.textContent = txt; r.txt = txt; }
    r.el.classList.toggle('cancel', mine);
    let p = 0;
    if (mine && rec.mode === 'new') p = recProg >= 0 ? recProg : 0;
    else if (l && pos) p = (mod(pos.idx - l.phase, l.bars) + pos.frac) / l.bars;
    r.prog.style.width = (p * 100) + '%';
  });
  if (status !== lastStatus) { $('recStatus').firstElementChild.textContent = status; lastStatus = status; }
  // input meter
  meterLevel = Math.max(meterPeak, meterLevel * 0.9); meterPeak = 0;
  const m = $('meter');
  m.classList.toggle('show', !!micStream);
  m.firstElementChild.style.width = Math.min(100, Math.sqrt(meterLevel) * 100) + '%';
  m.firstElementChild.style.background = meterLevel > 0.9 ? '#e5393b' : '#5ee08a';
  const lv = latencyMs() + (state.rec.latency != null ? ' ms' : ' auto');
  if ($('latVal').textContent !== lv) $('latVal').textContent = lv;
}

/* ---------- deck controls ---------- */
padsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  const slot = +b.dataset.slot, l = layerAt(slot);
  if (b.classList.contains('pad')) { onPadTap(slot); return; }
  if (b.classList.contains('del') && rec.state !== 'idle' && rec.state !== 'calib' && rec.slot === slot) {
    if (rec.state !== 'finish') cancelRec(rec.mode === 'dub' ? 'Overdub cancelled' : 'Take cancelled');
    return;
  }
  if (!l) return;
  if (b.classList.contains('mute')) { l.mute = !l.mute; if (ctx) applyLayerMix(l); renderPads(); save(); }
  else if (b.classList.contains('del')) {   // needs a second tap within 2.5 s
    if (!b._armed) {
      b.classList.add('armed'); b.textContent = '?';
      b._armed = setTimeout(() => { b._armed = 0; b.classList.remove('armed'); b.textContent = '✕'; }, 2500);
      return;
    }
    clearTimeout(b._armed); b._armed = 0; b.classList.remove('armed'); b.textContent = '✕';
    deleteLayer(l);
  }
});
padsEl.addEventListener('input', e => {
  if (!e.target.classList.contains('vol')) return;
  const l = layerAt(+e.target.dataset.slot);
  if (!l) return;
  l.vol = e.target.value / 100;
  setRange(e.target, e.target.value);
  if (ctx) applyLayerMix(l);
  save();
});
$('countIn').addEventListener('click', () => { state.rec.countIn = !state.rec.countIn; renderPads(); save(); });
$('deck').querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => {
  if (rec.state !== 'idle') return;
  state.rec.src = b.dataset.src; renderPads(); save();
}));
$('deck').querySelectorAll('[data-bars]').forEach(b => b.addEventListener('click', () => {
  if (rec.state !== 'idle') return;
  state.rec.bars = +b.dataset.bars; renderPads(); save();
}));
$('calib').addEventListener('click', calibrate);
{ // drag the delay number up/down to fine-tune by hand, like BPM
  const el = $('latVal');
  let drag = null;
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); drag = { y: e.clientY, v: latencyMs() }; });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const v = Math.max(0, Math.min(500, Math.round(drag.v + (drag.y - e.clientY) / 2)));
    if (v !== state.rec.latency) { state.rec.latency = v; save(); }
  });
  for (const ev of ['pointerup', 'pointercancel']) el.addEventListener(ev, () => { drag = null; });
}
window.addEventListener('resize', renderPads);

/* ---------- message banner ---------- */
let toastTimer = 0;
function toast(msg, kind, ms) {
  const t = $('toast');
  t.firstElementChild.textContent = msg;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { $('toast').className = ''; }
$('toast').querySelector('button').addEventListener('click', hideToast);

/* ---------------- housekeeping ---------------- */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerdown', () => initAudio(), { capture: true, once: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && playing) { if (ctx) ctx.resume(); keepAwake(true); }
  if (document.visibilityState === 'hidden') {   // never keep the mic open in the background
    if (rec.state !== 'idle' && rec.state !== 'finish') cancelRec();
    releaseMic();
  }
});
document.addEventListener('keydown', e => {   // handy when testing on a laptop
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : start(); }
  if (/^Digit[1-8]$/.test(e.code)) onPadTap(+e.code.slice(5) - 1);
});

/* ---------------- offline / install ---------------- */
// Service worker only runs over https (or localhost); opening the file directly just skips it.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
renderPads();
loadLayers();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
requestAnimationFrame(draw);
</script>
</body>
</html>
